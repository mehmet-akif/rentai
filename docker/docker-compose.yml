services:
  backend:
    build:
      context: ../backend
    container_name: rentai-backend
    ports:
      - "5001:5001"
    env_file:
      - ../backend/.env

  frontend:
    build:
      context: ../frontend
    container_name: rentai-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend